# Tests on every push and pull request, and the desktop program built on Linux, Windows and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: gofmt, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      # The window needs cgo; the converter, the command line tool and the window tests do not.
      - run: CGO_ENABLED=0 go vet ./hexconv ./internal/... ./cmd/hexconv
      - run: go test -race ./hexconv ./internal/... ./cmd/hexconv
      - name: Build the command line tool for Linux, Windows and macOS
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/hexconv
          done
      - name: License headers
        run: |
          missing=$(git ls-files '*.go' '*.yml' '*.yaml' | xargs -r grep -L 'SPDX-License-Identifier' || true)
          if [ -n "$missing" ]; then
            echo "These files have no license header:"
            echo "$missing"
            exit 1
          fi

  desktop:
    name: Desktop program (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: OpenGL, X11 and Wayland headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/hexconverter.exe ./cmd/hexconverter
            go build -trimpath -ldflags="-s -w" -o dist/hexconv.exe ./cmd/hexconv
          else
            go build -trimpath -ldflags="-s -w" -o dist/hexconverter ./cmd/hexconverter
            go build -trimpath -ldflags="-s -w" -o dist/hexconv ./cmd/hexconv
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: hexconverter-${{ runner.os }}
          path: dist/
          retention-days: 14
